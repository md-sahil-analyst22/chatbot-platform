# =============================================================================
# Saathi AI - PRODUCTION stack on the VPS (P1.10, ADR-0008)
#
# Released BY HAND on the server (docs/runbooks/vps-deploy.md), from ~/chatbot-platform:
#   1. docker compose --env-file .env -f infra/docker-compose.prod.yml down      (optional, see runbook)
#   2. git pull
#   3. docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
#
# Step 3 does the whole release, in this order:
#   build images -> migrate (one-shot; API/worker start only if it succeeds) -> redis, api, worker
#   -> studio (one-shot: builds Bot Studio and publishes it to the folder nginx serves)
#
# Differences from docker-compose.yml (local dev):
#   - runs the built image: no mounted source, no --reload, no dev tools
#   - only the API is published, on 127.0.0.1:8000, for host nginx (TLS + domain)
#   - fixed private network so uvicorn can trust X-Forwarded-* from nginx ONLY
#   - Postgres is Supabase (DATABASE_URL in .env); no database container here
#
# Rules: R24 (app never gets owner credentials), R25 (migrations are a one-shot job),
#        R17 (all secrets come from .env on the server, mode 600)
# =============================================================================
name: saathi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-backend: &backend
  <<: *hardening
  image: saathi-backend:prod
  env_file: ../.env
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    REDIS_URL: redis://redis:6379/0
    # Least privilege: the API and worker never see the owner/migration credentials.
    MIGRATION_DATABASE_URL: ""
    POSTGRES_OWNER_PASSWORD: ""
  depends_on:
    redis: { condition: service_healthy }
    # New code never runs against an old schema: start only after migrations succeed (R25).
    migrate: { condition: service_completed_successfully }
  restart: unless-stopped
  logging: *default-logging
  networks: [internal]

services:
  redis:
    <<: *hardening
    image: redis:7-alpine
    # Start as the image's own "redis" user: with cap_drop ALL, the root entrypoint's
    # chown-then-switch-user step would fail, and nothing here needs root anyway.
    user: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction # the ARQ job queue must never be silently evicted
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    # No ports: only the API and worker can reach Redis.

  api:
    <<: *backend
    # Image saathi-backend:prod is built once, by the migrate service below.
    # The image CMD runs uvicorn with --proxy-headers. Trust X-Forwarded-* ONLY from the Docker
    # gateway, which is where host nginx's connections appear from (fixed subnet below).
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: 172.30.0.1
    ports: ["127.0.0.1:8000:8000"] # host nginx only; the firewall blocks 8000 from outside anyway
    stop_grace_period: 30s

  worker:
    <<: *backend
    command: ["arq", "saathi.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "saathi.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 120s # let running jobs finish (they are idempotent, R33)

  # One-shot migration job (R25): runs on every `up`, before the API and worker start.
  # `alembic upgrade head` is a no-op when the schema is already current.
  migrate:
    <<: *hardening
    image: saathi-backend:prod
    build:
      context: ../backend
    env_file: ../.env
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env}
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"
    logging: *default-logging
    networks: [internal]

  # One-shot: builds Bot Studio against the public API address and copies it into the folder
  # host nginx serves for app.<base>. Exits when done; nginx keeps serving the files.
  studio:
    build:
      context: ../dashboard
      args:
        VITE_API_BASE_URL: ${STUDIO_API_BASE_URL:?set STUDIO_API_BASE_URL in .env, e.g. https://api.saathi.yourdomain.com}
    image: saathi-studio:prod
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE] # write into the deploy user's web folder; nothing else
    volumes:
      - ${STUDIO_WEB_ROOT:-/var/www/saathi-studio}:/out
    network_mode: none # copies files only; needs no network at all
    restart: "no"
    logging: *default-logging

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  redisdata:
