# =============================================================================
# Saathi AI - PRODUCTION stack on the VPS (P1.10, ADR-0008)
#
# Released BY HAND on the server (docs/runbooks/vps-deploy.md), from ~/chatbot-platform:
#   1. saathi down            (optional, see runbook)
#   2. git pull
#   3. saathi up -d --build
# (`saathi` = docker compose --env-file .env -f infra/docker-compose.prod.yml, set up by setup.sh)
#
# Step 3 does the whole release, in this order:
#   build images -> migrate (one-shot; API/worker start only if it succeeds) -> redis, api, worker
#   -> studio (Bot Studio web server)
#
# The front door is the server's EXISTING Traefik (Hostinger n8n template; host network, Docker
# provider, entrypoint "websecure", cert resolver "letsencrypt"). Traefik only routes containers
# labelled traefik.enable=true, and gets/renews HTTPS certificates for:
#   api.${SAATHI_BASE_DOMAIN}  -> api      (port 8000)
#   app.${SAATHI_BASE_DOMAIN}  -> studio   (port 8080)
# Nothing here touches Traefik or n8n.
#
# Rules: R24 (app never gets owner credentials), R25 (migrations are a one-shot job),
#        R17 (all secrets come from .env on the server, mode 600)
# =============================================================================
name: saathi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-backend: &backend
  <<: *hardening
  image: saathi-backend:prod
  env_file: ../.env
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    REDIS_URL: redis://redis:6379/0
    # Derived from the one base address, so it can't drift from the Studio URL.
    CORS_ALLOWED_ORIGINS: '["https://app.${SAATHI_BASE_DOMAIN:?set SAATHI_BASE_DOMAIN in .env}"]'
    # Least privilege: the API and worker never see the owner/migration credentials.
    MIGRATION_DATABASE_URL: ""
    POSTGRES_OWNER_PASSWORD: ""
  depends_on:
    redis: { condition: service_healthy }
    # New code never runs against an old schema: start only after migrations succeed (R25).
    migrate: { condition: service_completed_successfully }
  restart: unless-stopped
  logging: *default-logging
  networks: [internal]

services:
  redis:
    <<: *hardening
    image: redis:7-alpine
    # Start as the image's own "redis" user: with cap_drop ALL, the root entrypoint's
    # chown-then-switch-user step would fail, and nothing here needs root anyway.
    user: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction # the ARQ job queue must never be silently evicted
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]
    # No ports and no Traefik labels: only the API and worker can reach Redis.

  api:
    <<: *backend
    # Image saathi-backend:prod is built once, by the migrate service below.
    # The image CMD runs uvicorn with --proxy-headers. Traefik runs on the host network, so its
    # connections arrive from this network's gateway: trust X-Forwarded-* from there ONLY.
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: 172.30.0.1
    # Localhost only, for debugging on the server (`curl 127.0.0.1:8000/health`). Public traffic
    # comes through Traefik, never this port.
    ports: ["127.0.0.1:8000:8000"]
    stop_grace_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.saathi-api.rule=Host(`api.${SAATHI_BASE_DOMAIN:?set SAATHI_BASE_DOMAIN in .env}`)
      - traefik.http.routers.saathi-api.entrypoints=websecure
      - traefik.http.routers.saathi-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.saathi-api.middlewares=saathi-api-headers,saathi-api-ratelimit
      - traefik.http.services.saathi-api.loadbalancer.server.port=8000
      - traefik.http.middlewares.saathi-api-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.saathi-api-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.saathi-api-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.saathi-api-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      # Abuse limit per client IP (Traefik sees the real client address on the host network).
      - traefik.http.middlewares.saathi-api-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.saathi-api-ratelimit.ratelimit.burst=40

  worker:
    <<: *backend
    command: ["arq", "saathi.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "saathi.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 120s # let running jobs finish (they are idempotent, R33)

  # One-shot migration job (R25): runs on every `up`, before the API and worker start.
  # `alembic upgrade head` is a no-op when the schema is already current.
  migrate:
    <<: *hardening
    image: saathi-backend:prod
    build:
      context: ../backend
    env_file: ../.env
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env}
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"
    logging: *default-logging
    networks: [internal]

  # Bot Studio: static files served by non-root nginx on :8080, behind Traefik.
  studio:
    <<: *hardening
    build:
      context: ../dashboard
      args:
        VITE_API_BASE_URL: https://api.${SAATHI_BASE_DOMAIN:?set SAATHI_BASE_DOMAIN in .env}
    image: saathi-studio:prod
    environment:
      SAATHI_BASE_DOMAIN: ${SAATHI_BASE_DOMAIN} # for the Content-Security-Policy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks: [studio] # its own network: Bot Studio can't reach Redis or the API container
    labels:
      - traefik.enable=true
      - traefik.http.routers.saathi-studio.rule=Host(`app.${SAATHI_BASE_DOMAIN:?set SAATHI_BASE_DOMAIN in .env}`)
      - traefik.http.routers.saathi-studio.entrypoints=websecure
      - traefik.http.routers.saathi-studio.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.saathi-studio.middlewares=saathi-studio-headers
      - traefik.http.services.saathi-studio.loadbalancer.server.port=8080
      - traefik.http.middlewares.saathi-studio-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.saathi-studio-headers.headers.stsIncludeSubdomains=true

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  studio:
    ipam:
      config:
        - subnet: 172.30.1.0/24

volumes:
  redisdata:
