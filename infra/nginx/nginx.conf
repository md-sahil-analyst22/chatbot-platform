# Reverse proxy for the VPS stage (Phase 8+). Railway/Render provide their own edge.
# Nginx is the edge here, so it OVERWRITES forwarding headers instead of trusting the client's.

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream saathi_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 25m;          # document uploads
    client_body_timeout 30s;
    limit_conn conn_per_ip 50;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://saathi_api;
    }

    # SSE streaming: no buffering, long read timeout.
    location /api/v1/chat/stream {
        limit_req zone=api_per_ip burst=10 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_pass http://saathi_api;
    }

    # Agent inbox WebSocket.
    location /api/v1/inbox/ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_pass http://saathi_api;
    }
}
