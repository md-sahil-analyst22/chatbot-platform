[project]
name = "saathi-backend"
version = "0.1.0"
description = "Saathi AI - multilingual support chatbot platform (API + worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "redis>=5.2,<6",
  "arq>=0.26",
  "httpx>=0.28",
  "structlog>=24.4",
  "cryptography>=43",
  "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
# Added when the phase needs them, to keep the Phase 1 image small.
ingestion = ["pymupdf>=1.25"]   # Phase 2
agent = ["langgraph>=0.2"]      # Phase 3

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saathi"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["saathi.modules.knowledge.adapters.parsers.*"]
disallow_untyped_calls = false  # pymupdf is only partially typed

[[tool.mypy.overrides]]
module = ["arq.*", "pymupdf.*", "langgraph.*", "asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import tests.fakes
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs real postgres/redis (RUN_DB_TESTS=1)"]

# ---------------------------------------------------------------- import-linter
# Enforces the modular-monolith rules from docs/adr/0001.
[tool.importlinter]
root_package = "saathi"

[[tool.importlinter.contracts]]
name = "Platform must not depend on business modules"
type = "forbidden"
source_modules = ["saathi.platform"]
forbidden_modules = ["saathi.modules", "saathi.api", "saathi.bootstrap"]

[[tool.importlinter.contracts]]
name = "Shared API dependencies must not pull in the composition root"
type = "forbidden"
source_modules = ["saathi.api.deps", "saathi.api.errors", "saathi.api.middleware"]
forbidden_modules = ["saathi.bootstrap"]

[[tool.importlinter.contracts]]
name = "Layered modules: api > adapters > application > ports > domain"
type = "layers"
layers = ["api", "adapters", "application", "ports", "domain"]
containers = [
  "saathi.modules.tenancy",
  "saathi.modules.knowledge",
  "saathi.modules.conversation",
  "saathi.modules.channels",
  "saathi.modules.credentials",
]

[[tool.importlinter.contracts]]
name = "Business modules are independent (talk via public facades / events later)"
type = "independence"
modules = [
  "saathi.modules.tenancy",
  "saathi.modules.knowledge",
  "saathi.modules.conversation",
  "saathi.modules.channels",
  "saathi.modules.handoff",
  "saathi.modules.leads",
  "saathi.modules.analytics",
  "saathi.modules.credentials",
]
