# Deploy to the Hostinger VPS (P1.10, ADR-0008).
# Runs only after CI succeeded on a push to main, or manually (Actions -> Deploy -> Run workflow),
# e.g. to roll back to an older commit. Pull requests never deploy.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to deploy (empty = latest main)"
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cancelling a half-finished deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production # add required reviewers here if you want a manual approval step
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      # Untrusted input is passed via env (never interpolated into the script) and validated.
      REF_INPUT: ${{ github.event.inputs.ref }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check the server is configured
        id: configured
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy skipped: VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets are not set yet (docs/runbooks/vps-deploy.md step 8)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose the commit
        if: steps.configured.outputs.ok == 'true'
        id: target
        run: |
          sha="${REF_INPUT:-$RUN_SHA}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::'$sha' is not a commit SHA"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.configured.outputs.ok == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is restricted on the server to run scripts/vps/deploy.sh only;
          # the SHA we send becomes its argument (SSH_ORIGINAL_COMMAND).
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "deploy@${VPS_HOST}" "$SHA"

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
